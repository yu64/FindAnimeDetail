quarkus.http.root-path=/api

# LINE APIの接続先。未指定なら公式APIを使用する。
quarkus.rest-client.line-api-base.url=${LINE_API_BASE_URL:https://api.line.me}

# AnnictConfigと同じURL・トークン設定をREST Clientから利用する
quarkus.rest-client.annict-api.url=${annict-api.url:https://api.annict.com/graphql}
quarkus.rest-client.annict-api.connect-timeout=5000
quarkus.rest-client.annict-api.read-timeout=10000


# quarkus.native.enabled=true
# quarkus.package.jar.enabled=false

# アクセスログの有効化
quarkus.http.access-log.enabled=true

# ログフォーマット（%r: リクエストライン, %s: ステータス, %D: 処理時間など）
quarkus.http.access-log.pattern=%h %l %u %t "%r" %s %b %Dms

# 処理時間をミリ秒で計測するための開始時間記録を有効化
quarkus.http.record-request-start-time=true
