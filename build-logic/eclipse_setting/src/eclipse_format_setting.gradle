

plugins {

    id("com.diffplug.spotless")
}

//==========================================================================
//コード整形
//==========================================================================

// Eclipse フォーマッターによる Java の整形。規約: docs/コード規約.md
spotless {

    // check / build に spotlessCheck を含め、書式違反でビルドを失敗させる。
    enforceCheck = true

    java {
        target("src/*/java/**/*.java")

        // 波括弧・インデント・折り返しは Eclipse フォーマッターの設定に従う
        eclipse(libs.versions.eclipse.formatter.get())
            .configFile(rootProject.file(".vscode/eclipse-formatter.xml"))

        trimTrailingWhitespace()
        endWithNewline()
    }
}
